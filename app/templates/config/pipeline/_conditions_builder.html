{% set _conds = rule.conditions if (rule is defined and rule) else {} %}
<div class="conditions-builder" data-initial='{{ _conds | tojson }}'>
  <span class="field-label">
    Conditions
    <button type="button" class="field-tip" tabindex="0"
            aria-label="About rule conditions"
            data-tip="Match values in the event (e.g. status). Leave empty to match all. See Help for operators.">?</button>
  </span>
  <div class="conditions-builder__visual">
    <div class="conditions-builder__rows"></div>
    <p class="conditions-builder__empty text-muted" hidden>No conditions — matches all selected events.</p>
    <div class="conditions-builder__toolbar">
      <button type="button" class="btn btn--sm conditions-builder__add">Add condition</button>
      <button type="button" class="btn btn--sm conditions-builder__toggle">Advanced (JSON)</button>
    </div>
  </div>
  <div class="conditions-builder__json" hidden>
    <textarea class="input conditions-builder__textarea" rows="4" spellcheck="false"></textarea>
    <div class="conditions-builder__toolbar mt">
      <button type="button" class="btn btn--sm conditions-builder__toggle">Visual editor</button>
    </div>
  </div>
  <input type="hidden" name="conditions" class="conditions-builder__hidden" value="{}">
</div>
