{% set is_edit = is_edit if is_edit is defined else (event is defined and event and event.id) %}
<form method="post"
      action="{% if is_edit %}/config/pipeline/event/{{ event.id }}{% else %}/config/pipeline/source/{{ source.id }}/events{% endif %}"
      class="stack dialog__form"
      hx-post="{% if is_edit %}/config/pipeline/event/{{ event.id }}{% else %}/config/pipeline/source/{{ source.id }}/events{% endif %}"
      hx-target="#pipeline-dialog"
      hx-swap="innerHTML">
  {% include 'components/csrf.html' %}
  <header class="dialog__header flex items-center gap">
    <h2 class="dialog__title">{% if is_edit %}Edit Event Type{% else %}Add Event Type{% endif %} — {{ source.name }}</h2>
    <button type="button" class="btn btn--sm" onclick="this.closest('dialog').close()">Close</button>
  </header>
  {% if error %}
    <p class="alert alert--danger" role="alert">{{ error }}</p>
  {% endif %}

  <label class="stack">
    <span class="field-label">
      Event type *
      <button type="button" class="field-tip" tabindex="0"
              aria-label="About event type"
              {% if source.source_type == "poll" %}
              data-tip="Built-in: on_success, on_failure. Optional: always (every run). Custom types need a matching schedule setting. Stored lowercase."
              {% else %}
              data-tip="Read from a known event-type header (X-Event-Type first, then GitHub/Gitea/GitLab, Shopify/Contentful topics, Toast/Kick, or X-Webhook-Event), else body event_type, else body type. Register the exact topic string the provider sends. Stored lowercase; case variants match. Optional: always. Once any producer type exists, non-matching deliveries are rejected."
              {% endif %}
      >?</button>
    </span>
    <input name="name" type="text" class="input"
           value="{{ event.name if event is defined and event else '' }}"
           placeholder="{% if source.source_type == 'poll' %}always{% else %}status.changed{% endif %}"
           maxlength="200"
           required autofocus>
  </label>
  <label class="stack">
    <span class="field-label">
      Description
      <button type="button" class="field-tip" tabindex="0"
              aria-label="About event type description"
              data-tip="Optional note for you. Shown on the pipeline; senders don’t see it.">?</button>
    </span>
    <textarea name="description" rows="2" class="input"
              placeholder="{% if source.source_type == 'poll' %}Poll completed successfully{% else %}Fired when status changes{% endif %}">{{ event.description if event is defined and event else '' }}</textarea>
  </label>
  <div class="flex items-center gap">
    <button type="submit" class="btn btn--primary">{% if is_edit %}Save Event Type{% else %}Create Event Type{% endif %}</button>
  </div>
</form>
