<form method="post"
      action="/config/pipeline/sources"
      class="stack dialog__form"
      hx-post="/config/pipeline/sources"
      hx-target="this"
      hx-swap="none">
  {% include 'components/csrf.html' %}
  <header class="dialog__header flex items-center gap">
    <h2 class="dialog__title">Add Source</h2>
    <button type="button" class="btn btn--sm" onclick="this.closest('dialog').close()">Close</button>
  </header>
  <label class="stack">
    Name *
    <input name="name" type="text" class="input" placeholder="Warehouse sensors" required autofocus>
  </label>
  <label class="stack">
    Description
    <textarea name="description" rows="2" class="input"></textarea>
  </label>
  <label class="stack">
    <span class="field-label">
      Type
      <button type="button" class="field-tip" tabindex="0"
              aria-label="About source type"
              data-tip="Webhook: others send events to you. Poll: Para-Scope checks a URL on a schedule.">?</button>
    </span>
    <select name="source_type" class="input" id="source-type">
      <option value="webhook">Webhook</option>
      <option value="poll">Poll</option>
    </select>
  </label>

  <fieldset class="stack" id="webhook-secret-fields">
    <legend>
      <span class="field-label">
        Webhook secret (optional)
        <button type="button" class="field-tip" tabindex="0"
                aria-label="About webhook secret"
                data-tip="Optional shared password so only trusted senders are accepted. Leave blank if you don’t need verification.">?</button>
      </span>
    </legend>
    <label class="stack">
      Secret value
      <input name="webhook_secret_value" type="password" class="input" autocomplete="new-password">
    </label>
  </fieldset>

  <fieldset class="stack" id="schedule-fields" style="display:none">
    <legend>Initial schedule</legend>
    <label class="stack">
      <span class="field-label">
        Schedule type
        <button type="button" class="field-tip" tabindex="0"
                aria-label="About schedule type"
                data-tip="Interval: every N seconds. Cron: a schedule like 0 * * * * (every hour).">?</button>
      </span>
      <select name="schedule_type" class="input" id="sched-type">
        <option value="interval">Interval</option>
        <option value="cron">Cron Expression</option>
      </select>
    </label>
    <div id="interval-fields" class="stack">
      <label class="stack">
        Interval (seconds)
        <input name="interval_seconds" type="number" min="1" class="input" placeholder="3600">
      </label>
    </div>
    <div id="cron-fields" class="stack" style="display:none">
      <label class="stack">
        <span class="field-label">
          Cron Expression
          <button type="button" class="field-tip" tabindex="0"
                  aria-label="About cron expression"
                  data-tip="Five fields: minute hour day month weekday. Example: 0 * * * * = every hour.">?</button>
        </span>
        <input name="cron_expression" type="text" class="input" placeholder="0 * * * *">
      </label>
    </div>
    <label class="stack">
      <span class="field-label">
        Request method
        <button type="button" class="field-tip" tabindex="0"
                aria-label="About request method"
                data-tip="How Para-Scope requests the URL.">?</button>
      </span>
      <select name="handler_type" class="input">
        {% for t in ['http_get', 'http_post', 'http_put', 'http_delete'] %}
          <option value="{{ t }}">{{ t | http_method_label }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="stack">
      <span class="field-label">
        URL to check
        <button type="button" class="field-tip" tabindex="0"
                aria-label="About poll URL"
                data-tip="Full URL Para-Scope requests on each poll. Required for polling.">?</button>
      </span>
      <input name="handler_url" type="text" class="input" placeholder="https://api.example.com/data">
    </label>
    <label class="stack">
      <span class="field-label">
        Extra settings (JSON)
        <button type="button" class="field-tip" tabindex="0"
                aria-label="About extra settings"
                data-tip="Optional. Advanced: headers, query, body, which response field to keep, event name.">?</button>
      </span>
      <textarea name="handler_params" rows="2" class="input">{}</textarea>
    </label>
    <div class="flex items-center gap">
      <label class="stack" style="min-width:6em">
        <span class="field-label">
          Timeout (s)
          <button type="button" class="field-tip" tabindex="0"
                  aria-label="About timeout"
                  data-tip="Seconds to wait before giving up.">?</button>
        </span>
        <input name="timeout_seconds" type="number" min="1" value="30" class="input">
      </label>
      <label class="stack" style="min-width:6em">
        <span class="field-label">
          Retries
          <button type="button" class="field-tip" tabindex="0"
                  aria-label="About retries"
                  data-tip="Extra tries after a failure.">?</button>
        </span>
        <input name="retry_count" type="number" min="0" value="0" class="input">
      </label>
    </div>
  </fieldset>

  <div class="flex items-center gap">
    <button type="submit" class="btn btn--primary">Create Source</button>
  </div>
</form>
