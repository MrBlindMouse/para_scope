<form method="post"
      action="/config/pipeline/sources"
      class="stack dialog__form"
      hx-post="/config/pipeline/sources"
      hx-target="this"
      hx-swap="none">
  {% include 'components/csrf.html' %}
  <header class="dialog__header flex items-center gap">
    <h2 class="dialog__title">Add Source</h2>
    <button type="button" class="btn btn--sm" onclick="this.closest('dialog').close()">Close</button>
  </header>
  <label class="stack">
    Name *
    <input name="name" type="text" class="input" placeholder="Warehouse sensors" required autofocus>
  </label>
  <label class="stack">
    Description
    <textarea name="description" rows="2" class="input"></textarea>
  </label>
  <label class="stack">
    <span class="field-label">
      Type
      <button type="button" class="field-tip" tabindex="0"
              aria-label="About source type"
              data-tip="Webhook: others send events to you. Poll: Para-Scope runs one typed poller on a schedule.">?</button>
    </span>
    <select name="source_type" class="input" id="source-type">
      <option value="webhook">Webhook</option>
      <option value="poll">Poll</option>
    </select>
  </label>

  <label class="stack" id="webhook-provider-fieldset">
    Webhook verification
    <button type="button" class="field-tip" tabindex="0"
            aria-label="About webhook verification"
            data-tip="Choose how Para-Scope verifies inbound webhook authenticity.">?</button>
    <select name="webhook_provider" class="input" id="webhook-provider">
      <option value="generic_hmac" selected>Shared-secret HMAC (X-Webhook-*)</option>
      <option value="stripe">Stripe (Stripe-Signature)</option>
      <option value="github">GitHub / Gitea (X-Hub-Signature-256)</option>
      <option value="slack">Slack (X-Slack-Signature)</option>
      <option value="discord">Discord (Ed25519)</option>
      <option value="paypal">PayPal (verify-webhook-signature)</option>
    </select>
  </label>

  <fieldset class="stack" id="webhook-secret-fields">
    <legend>
      <span class="field-label">
        Webhook secret (optional)
        <button type="button" class="field-tip" tabindex="0"
                aria-label="About webhook secret"
                data-tip="Provider credential. Usually a shared secret; for Discord, use the app public key. Leave blank only if you don’t need verification.">?</button>
      </span>
    </legend>
    <label class="stack">
      Secret value
      <input name="webhook_secret_value" type="password" class="input" autocomplete="new-password">
    </label>
  </fieldset>

  <fieldset class="stack" id="paypal-fields" hidden>
    <legend>PayPal config</legend>
    <label class="stack">
      Webhook ID
      <input name="paypal_webhook_id" type="text" class="input" placeholder="e.g. 1JE4291016473214C">
    </label>
    <label class="stack">
      Client ID
      <input name="paypal_client_id" type="text" class="input" placeholder="PayPal app client id">
    </label>
    <label class="stack">
      Environment
      <select name="paypal_environment" class="input">
        <option value="sandbox" selected>Sandbox</option>
        <option value="live">Live</option>
      </select>
    </label>
    <p class="text-muted">Note: for PayPal, the “Webhook secret” field is the client secret.</p>
  </fieldset>

  <fieldset class="stack" id="schedule-fields" style="display:none">
    <legend>Initial schedule</legend>
    <label class="stack">
      <span class="field-label">
        Schedule type
        <button type="button" class="field-tip" tabindex="0"
                aria-label="About schedule type"
                data-tip="Interval: every N seconds. Cron: a schedule like 0 * * * * (every hour).">?</button>
      </span>
      <select name="schedule_type" class="input" id="sched-type">
        <option value="interval">Interval</option>
        <option value="cron">Cron Expression</option>
      </select>
    </label>
    <div id="interval-fields" class="stack">
      <label class="stack">
        Interval (seconds)
        <input name="interval_seconds" type="number" min="1" class="input" placeholder="3600">
      </label>
    </div>
    <div id="cron-fields" class="stack" style="display:none">
      <label class="stack">
        <span class="field-label">
          Cron Expression
          <button type="button" class="field-tip" tabindex="0"
                  aria-label="About cron expression"
                  data-tip="Five fields: minute hour day month weekday. Example: 0 * * * * = every hour.">?</button>
        </span>
        <input name="cron_expression" type="text" class="input" placeholder="0 * * * *">
      </label>
    </div>
    {% include 'config/pipeline/_poll_schedule_fields.html' %}
    <div class="flex items-center gap">
      <label class="stack" style="min-width:6em">
        <span class="field-label">
          Timeout (s)
          <button type="button" class="field-tip" tabindex="0"
                  aria-label="About timeout"
                  data-tip="Seconds to wait before giving up.">?</button>
        </span>
        <input name="timeout_seconds" type="number" min="1" value="30" class="input">
      </label>
      <label class="stack" style="min-width:6em">
        <span class="field-label">
          Retries
          <button type="button" class="field-tip" tabindex="0"
                  aria-label="About retries"
                  data-tip="Extra tries after a failure.">?</button>
        </span>
        <input name="retry_count" type="number" min="0" value="0" class="input">
      </label>
    </div>
  </fieldset>

  <div class="flex items-center gap">
    <button type="submit" class="btn btn--primary">Create Source</button>
  </div>
</form>

<script>
(function () {
  var provider = document.getElementById("webhook-provider");
  var paypalFields = document.getElementById("paypal-fields");
  var providerFieldset = document.getElementById("webhook-provider-fieldset");

  function sync() {
    var st = document.getElementById("source-type");
    var isWebhook = st && st.value === "webhook";
    if (providerFieldset) providerFieldset.hidden = !isWebhook;
    if (paypalFields && provider) paypalFields.hidden = (provider.value !== "paypal") || !isWebhook;
  }

  if (provider) provider.addEventListener("change", sync);
  var st = document.getElementById("source-type");
  if (st) st.addEventListener("change", sync);
  sync();
})();
</script>
