<!DOCTYPE html>
<html lang="en"
      data-theme="{{ theme|default('system') }}"
      data-font="{{ font|default('system') }}"
      data-font-size="{{ font_size|default('md') }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup – Para-Scope</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="auth-page">
  <main class="auth card stack">
    <h1 class="auth__brand">Para-Scope</h1>
    <p class="auth__title">Create the first account</p>
    {% if error %}
      <p class="alert alert--danger" role="alert">{{ error }}</p>
    {% endif %}
    <form method="post" action="/setup">
      <div class="stack">
        <label class="stack">
          Username
          <input class="input" name="username" type="text" required autofocus autocomplete="username">
        </label>
        <label class="stack">
          Password
          <input class="input" name="password" type="password" required autocomplete="new-password">
        </label>
        <button class="btn btn--primary" type="submit">Create account</button>
      </div>
    </form>
  </main>
</body>
</html>
